-
  name: 'Neos :: Frontend :: Event node in ics format'
  uriPattern: '{node}.ics'
  defaults:
    '@package': TYPO3.Neos
    '@controller': Frontend\Node
    '@action': show
    '@format': ics
  routeParts:
    node:
      handler: TYPO3\Neos\Routing\FrontendNodeRoutePartHandlerInterface
  appendExceedingArguments: true