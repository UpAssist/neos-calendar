'UpAssist.Neos.Calendar:Upcoming':
  superTypes:
    'Neos.Neos:Content': true
    'Neos.NodeTypes.BaseMixins:TitleMixin': true
  ui:
    label: 'Upcoming Events'
    inspector:
      groups:
        options:
          label: Options
  properties:
    showMoreEventsButton:
      type: boolean
      ui:
        label: 'Show more events button'
        reloadIfChanged: true
        inspector:
          group: options
    calendarPage:
      type: reference
      ui:
        label: 'Calender page'
        reloadIfChanged: true
        inspector:
          group: options
